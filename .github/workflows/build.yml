name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tab5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public-release privacy gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E \
            'C:[/\\]Users[/\\]|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[opusr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}' \
            -- .; then
            echo "Public tree contains a credential or personal-path marker."
            exit 1
          fi
          forbidden="$(git ls-files | grep -Ei '(^|/)(tile_key\.txt|wifi_secrets\.h|\.env|.*\.(pem|p12|pfx))$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Local credential files are tracked:"
            echo "$forbidden"
            exit 1
          fi
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Build Responder Nav
        run: pio run -e esp32p4_pioarduino55
      - name: Build Deploy Cam
        working-directory: deploy_cam_esp32cam
        run: pio run -e wrover_kit_deploy_cam
